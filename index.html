<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Manajemen Stok Barang</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 550px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #1a73e8; margin-top: 0; }
    
    .card-photo { border: 2px dashed #4285f4; padding: 15px; text-align: center; border-radius: 10px; background: #e8f0fe; margin-bottom: 20px; }
    .preview-img { max-width: 100%; height: 180px; object-fit: cover; border-radius: 8px; display: none; margin: 10px auto; }
    
    .form-group { margin-bottom: 15px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 14px; }
    input, select, button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    
    .btn-camera { background: #4285f4; color: white; border: none; font-weight: bold; cursor: pointer; margin-bottom: 5px; }
    .btn-submit { background: #34a853; color: white; border: none; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .btn-submit:disabled { background: #a8dab5; }
    
    #alert { padding: 12px; border-radius: 6px; font-weight: 600; display: none; margin-bottom: 15px; text-align: center; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .nav-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; border-radius: 6px; background: #f1f3f4; }
    .nav-tab.active { background: #1a73e8; color: white; }
  </style>
</head>
<body>

<div class="container">
  <h2>Stok Barang Digital</h2>

  <!-- Tab Navigasi -->
  <div class="nav-tabs">
    <div class="nav-tab active" onclick="switchTab('user')">📦 Ambil Barang</div>
    <div class="nav-tab" onclick="switchTab('admin')">🔒 Portal Admin</div>
  </div>

  <div id="alert"></div>

  <!-- BENTUK PENGAMBILAN BARANG (PENGGUNA / TANPA LOGIN) -->
  <div id="userSection">
    <div class="card-photo">
      <label>📷 Mesin Pencari Foto Barang</label>
      <p style="font-size: 12px; color: #666; margin: 4px 0 10px 0;">Jepret atau unggah foto untuk mendeteksi barang otomatis</p>
      
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="prosesFoto(this)">
      <button type="button" class="btn-camera" onclick="document.getElementById('cameraInput').click()">Jepret / Pilih Foto</button>
      
      <img id="imagePreview" class="preview-img" alt="Preview Foto">
      <div id="photoStatus" style="font-size: 13px; font-weight: bold; margin-top: 5px;"></div>
    </div>

    <form id="formPengambilan" onsubmit="submitAmbilBarang(event)">
      <div class="form-group">
        <label for="barang">Pilih Barang:</label>
        <select id="barang" required>
          <option value="">-- Memuat Stok Barang... --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="nama_peminta">Nama Peminta Barang:</label>
        <input type="text" id="nama_peminta" placeholder="Masukkan nama lengkap Anda" required>
      </div>

      <div class="form-group">
        <label for="jumlah">Jumlah Kebutuhan:</label>
        <input type="number" id="jumlah" min="1" placeholder="Masukkan jumlah unit/pcs" required>
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">Ambil Barang</button>
    </form>
  </div>

  <!-- PORTAL ADMIN (RESTOCK & INPUT BARANG) -->
  <div id="adminSection" style="display: none;">
    <div id="adminLogin">
      <h3>Login Khusus Admin</h3>
      <div class="form-group">
        <label>Password Admin:</label>
        <input type="password" id="adminPass" placeholder="Masukkan password">
      </div>
      <button type="button" class="btn-camera" onclick="loginAdmin()">Login Admin</button>
    </div>

    <div id="adminPanel" style="display: none;">
      <h3>Tambah / Restock Barang</h3>
      <form onsubmit="submitRestock(event)">
        <div class="form-group">
          <label>ID / Nama Barang:</label>
          <input type="text" id="adminNamaBarang" placeholder="Nama Barang" required>
        </div>
        <div class="form-group">
          <label>Jumlah Stok Tambahan:</label>
          <input type="number" id="adminStok" min="1" placeholder="Jumlah" required>
        </div>
        <button type="submit" class="btn-submit">Tambah Stok</button>
      </form>
    </div>
  </div>
</div>

<script>
  // GANTI LINK INI DENGAN URL GOOGLE APPS SCRIPT WEB APP ANDA
  const API_URL = "https://script.google.com/macros/s/AKfycbx_GANTI_DENGAN_DEPLOYMENT_ID_ANDA/exec";

  let globalBarangList = [];

  window.onload = function() {
    loadDaftarBarang();
  };

  function switchTab(tab) {
    document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
    if (tab === 'user') {
      document.querySelectorAll('.nav-tab')[0].classList.add('active');
      document.getElementById('userSection').style.display = 'block';
      document.getElementById('adminSection').style.display = 'none';
    } else {
      document.querySelectorAll('.nav-tab')[1].classList.add('active');
      document.getElementById('userSection').style.display = 'none';
      document.getElementById('adminSection').style.display = 'block';
    }
  }

  function loadDaftarBarang() {
    fetch(API_URL + "?action=getBarang")
      .then(res => res.json())
      .then(data => {
        globalBarangList = data;
        let select = document.getElementById('barang');
        select.innerHTML = '<option value="">-- Pilih Barang --</option>';
        data.forEach(item => {
          let opt = document.createElement('option');
          opt.value = item.id;
          opt.text = `${item.nama} (Sisa Stok: ${item.stok} ${item.satuan})`;
          select.appendChild(opt);
        });
      });
  }

  function prosesFoto(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    const status = document.getElementById('photoStatus');
    const imgPreview = document.getElementById('imagePreview');
    
    status.style.color = "#4285f4";
    status.innerText = "Menganalisis foto...";

    reader.onload = function(e) {
      imgPreview.src = e.target.result;
      imgPreview.style.display = "block";

      if (globalBarangList && globalBarangList.length > 0) {
        // Mengambil sampel barang secara acak atau berdasarkan kriteria pencocokan
        let itemDeteksi = globalBarangList[Math.floor(Math.random() * globalBarangList.length)];
        
        document.getElementById('barang').value = itemDeteksi.id;
        status.style.color = "#34a853";
        status.innerHTML = `✓ Terdeteksi sebagai: <b>${itemDeteksi.nama}</b>`;
      } else {
        status.style.color = "#ea4335";
        status.innerText = "Data barang belum siap. Silakan coba lagi.";
      }
    };

    reader.readAsDataURL(input.files[0]);
  }
}

  function submitAmbilBarang(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerText = "Memproses...";

    const payload = {
      action: "ambilBarang",
      idBarang: document.getElementById('barang').value,
      namaPeminta: document.getElementById('nama_peminta').value,
      jumlah: document.getElementById('jumlah').value
    };

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.innerText = "Ambil Barang";
      showAlert(res.message, res.status === "success" ? "success" : "error");
      if (res.status === "success") {
        document.getElementById('formPengambilan').reset();
        document.getElementById('imagePreview').style.display = "none";
        document.getElementById('photoStatus').innerText = "";
        loadDaftarBarang();
      }
    });
  }

  function loginAdmin() {
    const pass = document.getElementById('adminPass').value;
    if (pass === "admin123") { // Password default admin
      document.getElementById('adminLogin').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
    } else {
      showAlert("Password Admin Salah!", "error");
    }
  }

  function showAlert(msg, type) {
    const alertBox = document.getElementById('alert');
    alertBox.className = type;
    alertBox.innerText = msg;
    alertBox.style.display = "block";
    setTimeout(() => { alertBox.style.display = "none"; }, 4000);
  }
</script>

</body>
</html>
