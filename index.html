<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stok Barang AI - TensorFlow.js</title>
  
  <!-- 1. IMPORT LIBRARY TENSORFLOW.JS & MODEL COCO-SSD -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 550px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #1a73e8; margin-top: 0; }
    
    .card-photo { border: 2px dashed #4285f4; padding: 15px; text-align: center; border-radius: 10px; background: #e8f0fe; margin-bottom: 20px; }
    .preview-container { position: relative; display: inline-block; max-width: 100%; margin-top: 10px; }
    .preview-img { max-width: 100%; max-height: 250px; border-radius: 8px; display: none; }
    
    .form-group { margin-bottom: 15px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 14px; }
    input, select, button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    
    .btn-camera { background: #4285f4; color: white; border: none; font-weight: bold; cursor: pointer; margin-bottom: 5px; }
    .btn-submit { background: #34a853; color: white; border: none; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .btn-submit:disabled { background: #a8dab5; }
    
    #statusAI { font-size: 13px; font-weight: bold; margin-top: 8px; color: #1a73e8; }
    #alert { padding: 12px; border-radius: 6px; font-weight: 600; display: none; margin-bottom: 15px; text-align: center; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

<div class="container">
  <h2>Sistem Stok AI (TensorFlow)</h2>
  <div id="alert"></div>

  <!-- AREA PENGUNGGAHAN & AI DETEKSI -->
  <div class="card-photo">
    <label>🤖 Deteksi Objek AI Otomatis</label>
    <p style="font-size: 12px; color: #666; margin: 4px 0 10px 0;">Ambil foto barang untuk dideteksi oleh AI TensorFlow</p>
    
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="prosesDeteksiAI(this)">
    <button type="button" class="btn-camera" id="btnFoto" onclick="document.getElementById('cameraInput').click()" disabled>Memuat Model AI...</button>
    
    <div class="preview-container">
      <img id="imagePreview" class="preview-img" alt="Preview Foto">
    </div>
    <div id="statusAI">⏳ Menyiapkan model TensorFlow.js...</div>
  </div>

  <!-- FORM PENGAMBILAN BARANG -->
  <form id="formPengambilan" onsubmit="submitAmbilBarang(event)">
    <div class="form-group">
      <label for="barang">Pilih Barang (Hasil Deteksi AI):</label>
      <select id="barang" required>
        <option value="">-- Memuat Stok Barang... --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="nama_peminta">Nama Peminta Barang:</label>
      <input type="text" id="nama_peminta" placeholder="Masukkan nama Anda" required>
    </div>

    <div class="form-group">
      <label for="jumlah">Jumlah Kebutuhan:</label>
      <input type="number" id="jumlah" min="1" placeholder="Masukkan jumlah" required>
    </div>

    <button type="submit" id="btnSubmit" class="btn-submit">Proses Pengambilan</button>
  </form>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbx_GANTI_DENGAN_DEPLOYMENT_ID_ANDA/exec";

  let modelAI = null;
  let globalBarangList = [];

  // Kamus Pemetaan: Objek Bahasa Inggris COCO-SSD -> Nama Barang di Database Anda
  const kamusPencocokan = {
    "cell phone": ["HP", "Handphone", "Smartphone"],
    "laptop": ["Laptop", "Notebook"],
    "mouse": ["Mouse"],
    "keyboard": ["Keyboard"],
    "book": ["Buku", "Kertas", "Buku Tulis", "Rim"],
    "bottle": ["Botol", "Air Mineral", "Tumbler"],
    "scissors": ["Gunting"],
    "backpack": ["Tas", "Ransel"]
  };

  // 2. LOAD MODEL AI SAAT HALAMAN DIBUKA
  window.onload = async function() {
    loadDaftarBarang();
    
    try {
      // Memuat model Coco-SSD
      modelAI = await cocoSsd.load();
      document.getElementById('statusAI').innerText = "✅ Model AI Siap! Silakan ambil foto.";
      document.getElementById('statusAI').style.color = "#34a853";
      document.getElementById('btnFoto').disabled = false;
      document.getElementById('btnFoto').innerText = "📷 Jepret / Pilih Foto";
    } catch (err) {
      document.getElementById('statusAI').innerText = "❌ Gagal memuat AI. Menggunakan mode manual.";
      document.getElementById('statusAI').style.color = "#ea4335";
      document.getElementById('btnFoto').disabled = false;
    }
  };

  // 3. PROSES DETEKSI OBJEK MENGGUNAKAN AI
  async function prosesDeteksiAI(input) {
    if (input.files && input.files[0]) {
      const imgPreview = document.getElementById('imagePreview');
      const statusAI = document.getElementById('statusAI');
      
      statusAI.style.color = "#4285f4";
      statusAI.innerText = "🔍 AI sedang menganalisis gambar...";

      const reader = new FileReader();
      reader.onload = function(e) {
        imgPreview.src = e.target.result;
        imgPreview.style.display = "block";

        // Tunggu gambar dirender di DOM lalu lakukan deteksi
        imgPreview.onload = async () => {
          if (modelAI) {
            // Prediksi objek menggunakan model AI
            const predictions = await modelAI.detect(imgPreview);
            
            if (predictions.length > 0) {
              const objekTerdeteksi = predictions[0].class; // Ambil objek dengan tingkat kepastian tertinggi
              const akurasi = Math.round(predictions[0].score * 100);
              
              statusAI.style.color = "#34a853";
              statusAI.innerHTML = `🤖 Terdeteksi: <b>${objekTerdeteksi}</b> (Akurasi: ${akurasi}%)`;
              
              // Cocokkan hasil AI dengan data barang di Google Sheets
              cocokkanKeDatabase(objekTerdeteksi);
            } else {
              statusAI.style.color = "#ea4335";
              statusAI.innerText = "⚠️ Objek tidak terdeteksi. Silakan pilih barang secara manual.";
            }
          }
        };
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  // 4. LOGIKA PENCOCOKAN DENGAN DATABASE GOOGLE SHEETS
  function cocokkanKeDatabase(objekAI) {
    const kataKunciRekomendasi = kamusPencocokan[objekAI] || [objekAI];
    let barangDitemukan = null;

    // Cari barang di database yang namanya mengandung kata kunci
    for (let barang of globalBarangList) {
      for (let kata of kataKunciRekomendasi) {
        if (barang.nama.toLowerCase().includes(kata.toLowerCase())) {
          barangDitemukan = barang;
          break;
        }
      }
      if (barangDitemukan) break;
    }

    if (barangDitemukan) {
      document.getElementById('barang').value = barangDitemukan.id;
    } else {
      // Jika tidak ada kata kunci yang cocok, coba pencocokan string langsung
      const matchDirect = globalBarangList.find(b => b.nama.toLowerCase().includes(objekAI.toLowerCase()));
      if (matchDirect) {
        document.getElementById('barang').value = matchDirect.id;
      }
    }
  }

  function loadDaftarBarang() {
    fetch(API_URL + "?action=getBarang")
      .then(res => res.json())
      .then(data => {
        globalBarangList = data;
        let select = document.getElementById('barang');
        select.innerHTML = '<option value="">-- Pilih Barang --</option>';
        data.forEach(item => {
          let opt = document.createElement('option');
          opt.value = item.id;
          opt.text = `${item.nama} (Sisa Stok: ${item.stok} ${item.satuan})`;
          select.appendChild(opt);
        });
      });
  }

  function submitAmbilBarang(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerText = "Memproses...";

    const payload = {
      action: "ambilBarang",
      idBarang: document.getElementById('barang').value,
      namaPeminta: document.getElementById('nama_peminta').value,
      jumlah: document.getElementById('jumlah').value
    };

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.innerText = "Proses Pengambilan";
      showAlert(res.message, res.status === "success" ? "success" : "error");
      if (res.status === "success") {
        document.getElementById('formPengambilan').reset();
        document.getElementById('imagePreview').style.display = "none";
        document.getElementById('statusAI').innerText = "✅ Siap untuk foto berikutnya.";
        loadDaftarBarang();
      }
    });
  }

  function showAlert(msg, type) {
    const alertBox = document.getElementById('alert');
    alertBox.className = type;
    alertBox.innerText = msg;
    alertBox.style.display = "block";
    setTimeout(() => { alertBox.style.display = "none"; }, 4000);
  }
</script>

</body>
</html>
