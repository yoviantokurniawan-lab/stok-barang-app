<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tes Koneksi Stok Barang</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f9; }
    .card { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    select, button, input { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    #status { margin-top: 10px; font-weight: bold; color: #007bff; }
  </style>
</head>
<body>

<div class="card">
  <h2>Cek Stok Barang</h2>
  <div id="status">⏳ Memuat data dari Google Sheets...</div>

  <label for="barang">Pilih Barang:</label>
  <select id="barang">
    <option value="">-- Menunggu Data --</option>
  </select>

  <button onclick="loadData()">🔄 Refresh Data</button>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwDB5l67T_I6Yw3jXv3KYL1dfqi2CaWHwP5tVxVy-L6sKuO0S83mt5nRcIGzZBTIzA9oQ/exec";

  // Fungsi Callback JSONP
  function handleBarangData(data) {
    const select = document.getElementById('barang');
    const status = document.getElementById('status');

    if (data && data.length > 0) {
      select.innerHTML = '<option value="">-- Pilih Barang --</option>';
      data.forEach(item => {
        let opt = document.createElement('option');
        opt.value = item.id;
        opt.text = `${item.nama} (Stok: ${item.stok} ${item.satuan})`;
        select.appendChild(opt);
      });
      status.style.color = "green";
      status.innerText = `✅ Berhasil memuat ${data.length} barang dari Google Sheets!`;
    } else {
      status.style.color = "red";
      status.innerText = "⚠️ Data di Google Sheets kosong atau tab 'Barang' tidak ditemukan.";
    }
  }

  function loadData() {
    document.getElementById('status').innerText = "⏳ Memuat ulang data...";
    
    // Hapus script lama jika ada
    const oldScript = document.getElementById('jsonp-loader');
    if (oldScript) oldScript.remove();

    // Panggil API via JSONP
    const script = document.createElement('script');
    script.id = 'jsonp-loader';
    script.src = API_URL + "?action=getBarang&callback=handleBarangData";
    script.onerror = function() {
      document.getElementById('status').style.color = "red";
      document.getElementById('status').innerText = "❌ Gagal terhubung ke URL Google Apps Script.";
    };
    document.body.appendChild(script);
  }

  // Load otomatis saat halaman dibuka
  window.onload = loadData;
</script>

</body>
</html>
